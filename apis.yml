aid: instacoach
name: Instacoach
description: 'Instacoach is an AI-powered baseball training app that generates personalized, on-demand
  workout programs for athletes across hitting, pitching, arm care, fielding, catching, lifting, and
  mental performance. Programs are built by college and pro athletes and adapt to the user''s equipment
  and goals, with short guided drills, progress tracking, and stat logging. It is delivered as consumer
  iOS and Android apps plus a web experience, and also offers team training programs for coaches. Sector:
  consumer sports/fitness technology. Backed by GGV Capital. No public developer API surface was found
  during enrichment (no api./developer./docs. host, no /.well-known, llms.txt, or OpenAPI).'
